---
layout: default
---
<article class="reading-page">
  <header class="reading-header">
    <time class="eyebrow" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1>{{ page.title | escape }}</h1>
    {% if page.tags.size > 0 %}<div class="topic-list">{% for tag in page.tags %}<span class="tag">{{ tag | escape }}</span>{% endfor %}</div>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  <div class="post-return"><a href="{{ '/' | relative_url }}">← All notes</a></div>
</article>
