<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/author-shortcuts.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/japan-map.html' | relative_url }}">Explore Japan ↗</a>
      </nav>
    </header>
    <div class="author-shortcuts" data-author-shortcuts hidden>
      <span>Author shortcuts · this browser</span>
      <a href="{{ '/write.html' | relative_url }}">Write or upload a post</a>
      <a href="{{ '/publishing/' | relative_url }}">Publishing guide</a>
      <button class="text-button" type="button" data-hide-author-shortcuts>Hide shortcuts</button>
    </div>
    <main class="site-main" id="main-content" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <p>{{ site.title | escape }} · Notes & discoveries</p>
      <p>A place to learn, explore, and share.</p>
    </footer>
  </div>
</body>
</html>
